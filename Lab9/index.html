<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №9 — Портативна електроніка</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --accent-secondary: #a855f7;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 32px 20px;
        }

        header {
            max-width: 1240px;
            margin: 0 auto 32px;
            padding: 24px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(168, 85, 247, 0.12));
            border: 1px solid var(--border);
            border-radius: 16px;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .layout {
            max-width: 1240px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 28px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .gadget-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .gadget-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
        }

        .gadget-img {
            width: 100%;
            height: 175px;
            object-fit: cover;
            background-color: #0b1120;
        }

        .gadget-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 10px;
        }

        .tag {
            align-self: flex-start;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 4px 10px;
            border-radius: 999px;
        }

        .tag.shoe {
            background: rgba(56, 189, 248, 0.16);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.35);
        }

        .tag.grocerie {
            background: rgba(168, 85, 247, 0.16);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.35);
        }

        .gadget-name {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.35;
        }

        .gadget-stock {
            margin-top: auto;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .gadget-stock strong {
            color: var(--success);
        }

        .gadget-stock.out strong {
            color: #f87171;
        }

        .btn-buy {
            width: 100%;
            padding: 11px 14px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #0f172a;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-buy:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .btn-buy:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-buy:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .cart-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            position: sticky;
            top: 24px;
        }

        .cart-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .cart-top h2 {
            font-size: 1.2rem;
        }

        .cart-badge {
            background: var(--accent-secondary);
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
        }

        .cart-items {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 520px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid var(--border);
            animation: slideIn 0.25s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(8px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .cart-item img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-info {
            flex-grow: 1;
        }

        .cart-item-title {
            font-size: 0.92rem;
            font-weight: 600;
        }

        .cart-item-meta {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .cart-empty {
            text-align: center;
            color: var(--text-secondary);
            padding: 28px 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1><span>PocketTech</span> — Портативна електроніка</h1>
        <p>Лабораторна робота №9 • Робота з JavaScript об'єктами</p>
    </header>

    <main class="layout">
        <section>
            <div id="products-container" class="catalog-grid"></div>
        </section>

        <aside class="cart-panel">
            <div class="cart-top">
                <h2>Кошик</h2>
                <span id="basket-counter" class="cart-badge">0 од.</span>
            </div>
            <ul id="basket-list" class="cart-items">
                <li class="cart-empty">Кошик порожній. Додайте пристрій зі списку.</li>
            </ul>
        </aside>
    </main>

    <script src="file.js"></script>
</body>
</html>
