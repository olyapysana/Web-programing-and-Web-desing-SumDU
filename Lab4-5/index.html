<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтернет-магазин «Портативна електроніка»</title>
    <!-- Підключення зовнішнього файлу стилів -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main">

        <!-- Шапка сайту -->
        <div class="header">
            <img src="header-banner.jpg" alt="Портативна електроніка - Баннер" class="header-img">
            <h1>Магазин «Портативна електроніка»</h1>
        </div>

        <!-- Меню навігації -->
        <div class="menu">
            <a href="#">Головна</a>
            <a href="#">Каталог</a>
            <a href="#">Про нас</a>
            <a href="#">Контакти</a>
        </div>

        <!-- Основний контент із 12 зображеннями у 4 ряди (по 3 в ряді) -->
        <div class="content">

            <!-- Ряд 1 -->
            <div class="photorow">
                <div class="photo">
                    <img src="smartphone.jpg" alt="Смартфон">
                    <p>Смартфон</p>
                </div>
                <div class="photo">
                    <img src="laptop.jpg" alt="Ноутбук">
                    <p>Ноутбук</p>
                </div>
                <div class="photo">
                    <img src="tablet.jpg" alt="Планшет">
                    <p>Планшет</p>
                </div>
            </div>

            <!-- Ряд 2 -->
            <div class="photorow">
                <div class="photo">
                    <img src="smartwatch.jpg" alt="Смарт-годинник">
                    <p>Смарт-годинник</p>
                </div>
                <div class="photo">
                    <img src="headphones.jpg" alt="Бездротові навушники">
                    <p>Бездротові навушники</p>
                </div>
                <div class="photo">
                    <img src="powerbank.jpg" alt="Павербанк">
                    <p>Павербанк</p>
                </div>
            </div>

            <!-- Ряд 3 -->
            <div class="photorow">
                <div class="photo">
                    <img src="speaker.jpg" alt="Портативна колонка">
                    <p>Портативна колонка</p>
                </div>
                <div class="photo">
                    <img src="camera.jpg" alt="Екшн-камера">
                    <p>Екшн-камера</p>
                </div>
                <div class="photo">
                    <img src="reader.jpg" alt="Електронна книга">
                    <p>Електронна книга</p>
                </div>
            </div>

            <!-- Ряд 4 -->
            <div class="photorow">
                <div class="photo">
                    <img src="console.jpg" alt="Портативна консоль">
                    <p>Портативна консоль</p>
                </div>
                <div class="photo">
                    <img src="router.jpg" alt="Мобільний роутер">
                    <p>Мобільний роутер</p>
                </div>
                <div class="photo">
                    <img src="projector.jpg" alt="Міні-проєктор">
                    <p>Міні-проєктор</p>
                </div>
            </div>

        </div>

        <!-- Підвал сайту з інформацією про розробника -->
        <div class="footer">
            Писана Ольга &copy; 2026 
        </div>

    </div>

</body>
</html>
