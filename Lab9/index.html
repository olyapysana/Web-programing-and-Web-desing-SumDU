<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №9 — Портативна електроніка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1><span>PocketTech</span> — Портативна електроніка</h1>
        <p>Лабораторна робота №9 • Робота з JavaScript об'єктами</p>
    </header>

    <main class="store-layout">
        <section>
            <div id="catalog-container" class="catalog-grid"></div>
        </section>

        <aside class="basket-box">
            <div class="basket-header">
                <h2>Кошик</h2>
                <span id="basket-count" class="basket-badge">0</span>
            </div>
            <div id="basket-list" class="basket-list">
                <p class="empty-msg">Кошик порожній. Додайте товари з каталогу.</p>
            </div>
        </aside>
    </main>

    <script src="file.js"></script>
</body>
</html>
