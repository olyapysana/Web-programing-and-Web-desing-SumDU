<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №9 — Портативна електроніка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1><span>PocketTech</span> — Портативна електроніка</h1>
        <p>Лабораторна робота №9 • Робота з JavaScript об'єктами</p>
    </header>

    <main class="layout">
        <section>
            <div id="products-container" class="catalog-grid"></div>
        </section>

        <aside class="cart-panel">
            <div class="cart-top">
                <h2>Кошик</h2>
                <span id="basket-counter" class="cart-badge">0 од.</span>
            </div>
            <ul id="basket-list" class="cart-items">
                <li class="cart-empty">Кошик порожній. Додайте пристрій зі списку.</li>
            </ul>
        </aside>
    </main>

    <script src="file.js"></script>
</body>
</html>
