<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин «Портативна електроніка» </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero-banner">
        <div class="hero-overlay">
            <h1>Магазин «Портативна електроніка»</h1>
        </div>
    </header>

    <main class="store-layout">
        <section class="catalog-box">
            <h2 class="catalog-title">Каталог товарів</h2>
            <div id="catalog-container" class="catalog-grid"></div>
        </section>

        <aside class="basket-box">
            <div class="basket-header">
                <h2>Кошик</h2>
                <span id="basket-count" class="basket-badge">0</span>
            </div>
            <div id="basket-list" class="basket-list">
                <p class="empty-msg">Кошик порожній. Додайте товари з каталогу.</p>
            </div>
        </aside>
    </main>

    <script src="file.js"></script>
</body>
</html>
